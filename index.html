<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Linhas</title>

    <link
        rel="stylesheet"
        href="./css/style.css?v=7"
    >

    <link
        rel="stylesheet"
        href="./css/modal-linha.css"
    >

    <link
        rel="stylesheet"
        href="./css/modal-exclusao.css"
    >

</head>


<body>

    <!--
    ==========================================================
    CABEÇALHO
    ==========================================================
    -->

    <header>

        <h1>
            Cadastro de Linhas
        </h1>

    </header>


    <!--
    ==========================================================
    CONTEÚDO
    ==========================================================
    -->

    <main>


        <!--
        ======================================================
        BARRA DE AÇÕES
        ======================================================
        -->

        <div class="barra-acoes">

            <div class="acoes-esquerda">

                <a
                    href="./empresas.html"
                    class="btn-voltar"
                >
                    VOLTAR
                </a>

                <button
                    type="button"
                    id="btnNovaLinha"
                    class="btn-novo"
                >
                    NOVA LINHA
                </button>

            </div>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar linhas..."
                autocomplete="off"
            >

        </div>


        <!--
        ======================================================
        TABELA
        ======================================================
        -->

        <div class="tabela-container">

            <table id="tabelaLinhas">


                <!--
                ==================================================
                CABEÇALHO
                ==================================================
                -->

                <thead>

                    <tr>


                        <!-- EMPRESA -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Empresa
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="empresa"
                                    title="Filtrar Empresa"
                                    aria-label="Filtrar Empresa"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- CÓDIGO -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Cód.
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="cod"
                                    title="Filtrar Código"
                                    aria-label="Filtrar Código"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- LINHA -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Linha
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="linha"
                                    title="Filtrar Linha"
                                    aria-label="Filtrar Linha"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- TIPO -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Tipo
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="tipo"
                                    title="Filtrar Tipo"
                                    aria-label="Filtrar Tipo"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- EMBARQUE IDA -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Embarque Ida
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="embarque_ida"
                                    title="Filtrar Embarque Ida"
                                    aria-label="Filtrar Embarque Ida"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- EMBARQUE VOLTA -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Embarque Volta
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="embarque_volta"
                                    title="Filtrar Embarque Volta"
                                    aria-label="Filtrar Embarque Volta"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- TARIFA CARTÃO -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Cartão
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="tarifa_cartao"
                                    title="Filtrar Tarifa Cartão"
                                    aria-label="Filtrar Tarifa Cartão"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- TARIFA DINHEIRO -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Dinheiro
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="tarifa_dinheiro"
                                    title="Filtrar Tarifa Dinheiro"
                                    aria-label="Filtrar Tarifa Dinheiro"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- STATUS -->

                        <th>

                            <div class="cabecalho-coluna">

                                <span>
                                    Status
                                </span>

                                <button
                                    type="button"
                                    class="btn-filtro"
                                    data-coluna="status"
                                    title="Filtrar Status"
                                    aria-label="Filtrar Status"
                                >
                                    ▼
                                </button>

                            </div>

                        </th>


                        <!-- AÇÕES -->

                        <th>
                            Ações
                        </th>


                    </tr>

                </thead>


                <!--
                ==================================================
                REGISTROS
                ==================================================
                -->

                <tbody id="listaLinhas">

                    <tr>

                        <td colspan="10">
                            Carregando dados...
                        </td>

                    </tr>

                </tbody>


            </table>

        </div>


        <!--
        ======================================================
        PAGINAÇÃO
        ======================================================
        -->

        <div
            id="paginacao"
            class="paginacao"
        >

            <button
                type="button"
                id="btnPaginaAnterior"
            >
                &laquo; Anterior
            </button>


            <span id="infoPagina">
                Página 1 de 1
            </span>


            <button
                type="button"
                id="btnProximaPagina"
            >
                Próxima &raquo;
            </button>

        </div>


        <!--
        ======================================================
        MENSAGENS
        ======================================================
        -->

        <div
            id="mensagem"
            class="mensagem"
        ></div>


    </main>


    <!--
    ==========================================================
    MODAL CADASTRO / EDIÇÃO
    ==========================================================
    -->

    <div id="containerModal"></div>


    <!--
    ==========================================================
    MODAL EXCLUSÃO
    ==========================================================
    -->

    <div id="containerModalExclusao"></div>


    <!--
    ==========================================================
    MENU FLUTUANTE DO FILTRO
    ==========================================================
    -->

    <div
        id="menuFiltro"
        class="menu-filtro"
    >

        <div class="menu-filtro-titulo">

            <span id="tituloFiltro">
                Filtrar
            </span>

        </div>


        <div class="menu-filtro-pesquisa">

            <input
                type="text"
                id="pesquisaFiltro"
                placeholder="Pesquisar..."
                autocomplete="off"
            >

        </div>


        <div class="menu-filtro-opcoes">

            <label class="opcao-filtro">

                <input
                    type="checkbox"
                    id="selecionarTodosFiltro"
                >

                <span>
                    Selecionar todos
                </span>

            </label>


            <div id="listaOpcoesFiltro">

                <!--
                Opções serão criadas
                pelo JavaScript
                -->

            </div>

        </div>


        <div class="menu-filtro-acoes">

            <button
                type="button"
                id="btnLimparFiltro"
            >
                LIMPAR
            </button>


            <button
                type="button"
                id="btnAplicarFiltro"
            >
                APLICAR
            </button>

        </div>

    </div>


    <!--
    ==========================================================
    JAVASCRIPT
    ==========================================================
    -->

    <script src="./js/script.js?v=11"></script>

</body>

</html>
