<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Linhas</title>


    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    >


    <!-- CSS DA MODAL -->
    <link
        rel="stylesheet"
        href="./css/modal-linha.css"
    >

    <link
    rel="stylesheet"
    href="./css/modal-exclusao.css"
>

</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header>

        <h1>
            Cadastro de Linhas
        </h1>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main>


        <!-- =================================================
             BARRA DE AÇÕES
        ================================================== -->

        <section class="barra-acoes">

            <button
                type="button"
                id="btnNovaLinha"
                class="btn-novo"
            >
                + NOVA LINHA
            </button>


            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar linha..."
                autocomplete="off"
            >

        </section>


        <!-- =================================================
             TABELA
        ================================================== -->

        <section class="tabela-container">

            <table id="tabelaLinhas">

                <thead>
    <tr>

        <th>
            <div class="cabecalho-filtro">
                <span>Empresa</span>

                <input
                    type="text"
                    id="filtroEmpresa"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Cód.</span>

                <input
                    type="text"
                    id="filtroCod"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Linha</span>

                <input
                    type="text"
                    id="filtroLinha"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Tipo</span>

                <input
                    type="text"
                    id="filtroTipo"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Embarque Ida</span>

                <input
                    type="text"
                    id="filtroEmbarqueIda"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Embarque Volta</span>

                <input
                    type="text"
                    id="filtroEmbarqueVolta"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Tarifa Cartão</span>

                <input
                    type="text"
                    id="filtroTarifaCartao"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Tarifa Dinheiro</span>

                <input
                    type="text"
                    id="filtroTarifaDinheiro"
                    class="filtro-coluna"
                    placeholder="Filtrar..."
                >
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Status</span>

                <select
                    id="filtroStatus"
                    class="filtro-coluna"
                >
                    <option value="">Todos</option>
                    <option value="Ativa">Ativa</option>
                    <option value="Inativa">Inativa</option>
                </select>
            </div>
        </th>

        <th>
            <div class="cabecalho-filtro">
                <span>Ações</span>

                <button
                    type="button"
                    id="btnLimparFiltros"
                    class="btn-limpar-filtros"
                >
                    Limpar
                </button>
            </div>
        </th>

    </tr>
</thead>


                <tbody id="listaLinhas">

                    <tr>

                        <td colspan="10">
                            Carregando dados...
                        </td>

                    </tr>

                </tbody>

            </table>
             <br>   
            <div
            
    id="paginacao"
    class="paginacao"
>

    <button
        type="button"
        id="btnPaginaAnterior"
    >
        &laquo; Anterior
    </button>


    <span id="infoPagina">
        Página 1 de 1
    </span>


    <button
        type="button"
        id="btnProximaPagina"
    >
        Próxima &raquo;
    </button>

</div>

        </section>


        <!-- =================================================
             MENSAGENS
        ================================================== -->

        <div
            id="mensagem"
            class="mensagem"
        ></div>


    </main>


    <!-- =====================================================
         MODAL

         O conteúdo de:
         modals/linha.html

         será carregado aqui pelo JavaScript.
    ====================================================== -->

    <div id="containerModal"></div>
    <div id="containerModalExclusao"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js/script.js?v=7"></script>


</body>

</html>
