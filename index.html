<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Linhas</title>


    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    >


    <!-- CSS DA MODAL -->
    <link
        rel="stylesheet"
        href="./css/modal-linha.css"
    >

</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header>

        <h1>
            Cadastro de Linhas
        </h1>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main>


        <!-- =================================================
             BARRA DE AÇÕES
        ================================================== -->

        <section class="barra-acoes">

            <button
                type="button"
                id="btnNovaLinha"
                class="btn-novo"
            >
                + NOVA LINHA
            </button>


            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar linha..."
                autocomplete="off"
            >

        </section>


        <!-- =================================================
             TABELA
        ================================================== -->

        <section class="tabela-container">

            <table id="tabelaLinhas">

                <thead>

                    <tr>

                        <th>
                            Empresa
                        </th>

                        <th>
                            Cód.
                        </th>

                        <th>
                            Linha
                        </th>

                        <th>
                            Tipo
                        </th>

                        <th>
                            Embarque Ida
                        </th>

                        <th>
                            Embarque Volta
                        </th>

                        <th>
                            Tarifa Cartão
                        </th>

                        <th>
                            Tarifa Dinheiro
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="listaLinhas">

                    <tr>

                        <td colspan="10">
                            Carregando dados...
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>


        <!-- =================================================
             MENSAGENS
        ================================================== -->

        <div
            id="mensagem"
            class="mensagem"
        ></div>


    </main>


    <!-- =====================================================
         MODAL

         O conteúdo de:
         modals/linha.html

         será carregado aqui pelo JavaScript.
    ====================================================== -->

    <div id="containerModal"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js/script.js?v=3"></script>


</body>

</html>
