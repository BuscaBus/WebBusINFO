<div
    id="modalExclusao"
    class="modal modal-exclusao"
>

    <div class="modal-conteudo modal-exclusao-conteudo">

        <div class="modal-exclusao-cabecalho">

            <h2>
                Confirmar exclusão
            </h2>

            <button
                type="button"
                id="btnFecharExclusao"
                class="modal-fechar"
                aria-label="Fechar"
            >
                &times;
            </button>

        </div>


        <div class="modal-exclusao-corpo">

            <p>
                Deseja realmente excluir esta linha?
            </p>

            <p
                id="descricaoExclusao"
                class="descricao-exclusao"
            ></p>

            <p class="aviso-exclusao">
                Esta operação removerá o registro da planilha.
            </p>

        </div>


        <div class="modal-exclusao-acoes">

            <button
                type="button"
                id="btnCancelarExclusao"
                class="btn-cancelar-exclusao"
            >
                CANCELAR
            </button>

            <button
                type="button"
                id="btnConfirmarExclusao"
                class="btn-confirmar-exclusao"
            >
                EXCLUIR
            </button>

        </div>

    </div>

</div>
