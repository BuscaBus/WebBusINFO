
<!--
==================================================
MODAL MAPA DA LINHA
==================================================
-->

<div id="modalMapa" class="modal modal-mapa">

    <div class="modal-mapa-conteudo">

        <!-- CABEÇALHO -->

        <div class="modal-mapa-cabecalho">

            <h2 id="tituloMapa">
                Mapa da Linha
            </h2>

            <button
                type="button"
                id="btnFecharMapa"
                class="btn-fechar-mapa"
                aria-label="Fechar mapa"
            >
                &times;
            </button>

        </div>


        <!-- CONTROLES IDA / VOLTA / AMBOS -->

        <div class="legenda-mapa">

            <span class="legenda-titulo">
                Exibir trajeto:
            </span>

            <div class="controles-sentido">

                <button
                    type="button"
                    class="btn-sentido ativo"
                    data-sentido="ambos"
                    aria-pressed="true"
                >
                    Ambos
                </button>

                <button
                    type="button"
                    class="btn-sentido"
                    data-sentido="ida"
                    aria-pressed="false"
                >
                    <span class="indicador-ida"></span>
                    Ida
                </button>

                <button
                    type="button"
                    class="btn-sentido"
                    data-sentido="volta"
                    aria-pressed="false"
                >
                    <span class="indicador-volta"></span>
                    Volta
                </button>

            </div>

            <!-- MENSAGENS DO MAPA -->

            <span
                id="legendaMapa"
                class="legenda-status"
                aria-live="polite"
            ></span>

        </div>


        <!-- MAPA LEAFLET -->

        <div id="mapaLinha"></div>


        <!-- RODAPÉ -->

        <div class="modal-rodape">

            <button
                type="button"
                id="btnEditarTracado"
                class="btn-editar-tracado"
            >
                EDITAR TRAÇADO
            </button>

            <button
                type="button"
                id="btnSalvarTracado"
                class="btn-salvar-tracado"
                style="display: none;"
            >
                SALVAR ALTERAÇÕES
            </button>

            <button
                type="button"
                id="btnCancelarEdicao"
                class="btn-cancelar-edicao"
                style="display: none;"
            >
                CANCELAR EDIÇÃO
            </button>

            <button
                type="button"
                id="btnVoltarMapa"
                class="btn-voltar-mapa"
            >
                FECHAR
            </button>

        </div>
    </div>

</div>
