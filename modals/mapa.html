
<!-- MODAL MAPA DA LINHA -->

<div id="modalMapa" class="modal modal-mapa">

    <div class="modal-mapa-conteudo">

        <div class="modal-mapa-cabecalho">

            <h2 id="tituloMapa">
                Mapa da Linha
            </h2>

            <button
                type="button"
                id="btnFecharMapa"
                class="btn-fechar-mapa"
                aria-label="Fechar mapa"
            >
                &times;
            </button>

        </div>

        
    <!-- CONTROLES DOS SENTIDOS -->

    <div class="legenda-mapa">

        <span class="legenda-titulo">
            Exibir trajeto:
        </span>

        <div class="controles-sentido">

            <button
                type="button"
                class="btn-sentido ativo"
                data-sentido="ambos"
            >
                Ambos
            </button>

            <button
                type="button"
                class="btn-sentido"
                data-sentido="ida"
            >
                <span class="indicador-ida"></span>
                Ida
            </button>

            <button
                type="button"
                class="btn-sentido"
                data-sentido="volta"
            >
                <span class="indicador-volta"></span>
                Volta
            </button>

        </div>

        <span id="legendaMapa" class="legenda-status"></span>

    </div>


    </div>

</div>
