
<!-- MODAL MAPA DA LINHA -->

<div id="modalMapa" class="modal modal-mapa">

    <div class="modal-mapa-conteudo">

        <div class="modal-mapa-cabecalho">

            <h2 id="tituloMapa">
                Mapa da Linha
            </h2>

            <button
                type="button"
                id="btnFecharMapa"
                class="btn-fechar-mapa"
                aria-label="Fechar mapa"
            >
                &times;
            </button>

        </div>

        <div id="legendaMapa" class="legenda-mapa"></div>

        <div id="mapaLinha"></div>

        <div class="modal-mapa-rodape">
            <button
                type="button"
                id="btnVoltarMapa"
                class="btn-voltar-mapa"
            >
                FECHAR
            </button>
        </div>

    </div>

</div>
