<!--
==========================================================
MODAL TARIFA
==========================================================
-->

<div
    id="modalTarifa"
    class="modal"
>

    <div class="modal-conteudo">


        <!--
        ==================================================
        CABEÇALHO
        ==================================================
        -->

        <div class="modal-cabecalho">

            <h2 id="tituloModalTarifa">
                Nova Tarifa
            </h2>

            <button
                type="button"
                id="btnFecharModalTarifa"
                class="modal-fechar"
                aria-label="Fechar"
            >
                &times;
            </button>

        </div>


        <!--
        ==================================================
        FORMULÁRIO
        ==================================================
        -->

        <form id="formTarifa">


            <!--
            ID INTERNO
            -->

            <input
                type="hidden"
                id="id_tarifa"
            >


            <div class="form-grid">


                <!--
                ==========================================
                TIPO
                ==========================================
                -->

                <div class="campo campo-grande">

                    <label for="tipo">
                        Tipo *
                    </label>

                    <input
                        type="text"
                        id="tipo"
                        maxlength="100"
                        required
                        autocomplete="off"
                        placeholder="Ex.: Convencional"
                    >

                </div>


                <!--
                ==========================================
                TARIFA CARTÃO
                ==========================================
                -->

                <div class="campo">

                    <label for="tarifa_cartao">
                        Tarifa Cartão
                    </label>

                    <input
                        type="number"
                        id="tarifa_cartao"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0,00"
                    >

                </div>


                <!--
                ==========================================
                TARIFA DINHEIRO
                ==========================================
                -->

                <div class="campo">

                    <label for="tarifa_dinheiro">
                        Tarifa Dinheiro
                    </label>

                    <input
                        type="number"
                        id="tarifa_dinheiro"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0,00"
                    >

                </div>


                <!--
                ==========================================
                ATUALIZAÇÃO
                ==========================================
                -->

                <div class="campo">

                    <label for="atualizacao">
                        Atualização
                    </label>

                    <input
                        type="date"
                        id="atualizacao"
                    >

                </div>


            </div>


            <!--
            ==================================================
            BOTÕES
            ==================================================
            -->

            <div class="modal-acoes">

                <button
                    type="button"
                    id="btnCancelarTarifa"
                    class="btn-cancelar"
                >
                    CANCELAR
                </button>


                <button
                    type="submit"
                    class="btn-salvar"
                >
                    SALVAR
                </button>

            </div>


        </form>

    </div>

</div>
