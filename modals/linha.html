<div id="modalLinha" class="modal">

    <div class="modal-conteudo">

        <div class="modal-cabecalho">

            <h2 id="tituloModal">
                Nova Linha
            </h2>

            <button
                type="button"
                id="btnFecharModal"
                class="btn-fechar"
                aria-label="Fechar"
            >
                &times;
            </button>

        </div>

        <form id="formLinha">

            <!-- ID INTERNO - NÃO VISÍVEL -->
            <input
                type="hidden"
                id="id_linha"
            >

            <div class="form-grid">

                <div class="campo campo-grande">

                    <label for="empresa">
                        Empresa *
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cod">
                        Código *
                    </label>

                    <input
                        type="text"
                        id="cod"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select id="tipo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Convencional">
                            Convencional
                        </option>

                        <option value="Executivo">
                            Executivo
                        </option>

                    </select>

                </div>


                <div class="campo campo-grande">

                    <label for="linha">
                        Linha *
                    </label>

                    <input
                        type="text"
                        id="linha"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="embarque_ida">
                        Embarque Ida
                    </label>

                    <input
                        type="text"
                        id="embarque_ida"
                    >

                </div>


                <div class="campo">

                    <label for="embarque_volta">
                        Embarque Volta
                    </label>

                    <input
                        type="text"
                        id="embarque_volta"
                    >

                </div>


                <div class="campo">

                    <label for="tarifa_cartao">
                        Tarifa Cartão
                    </label>

                    <input
                        type="number"
                        id="tarifa_cartao"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                    >

                </div>


                <div class="campo">

                    <label for="tarifa_dinheiro">
                        Tarifa Dinheiro
                    </label>

                    <input
                        type="number"
                        id="tarifa_dinheiro"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                    >

                </div>


                <div class="campo">

                    <label for="status">
                        Status *
                    </label>

                    <select
                        id="status"
                        required
                    >

                        <option value="Ativa">
                            Ativa
                        </option>

                        <option value="Inativa">
                            Inativa
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-botoes">

                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-cancelar"
                >
                    CANCELAR
                </button>

                <button
                    type="submit"
                    id="btnSalvar"
                    class="btn-salvar"
                >
                    SALVAR
                </button>

            </div>

        </form>

    </div>

</div>
