<div id="modalLinha" class="modal">

    <div class="modal-conteudo">

        <!--
        ==================================================
        CABEÇALHO
        ==================================================
        -->

        <div class="modal-cabecalho">

            <h2 id="tituloModal">
                Nova Linha
            </h2>

            <button
                type="button"
                id="btnFecharModal"
                class="btn-fechar"
                aria-label="Fechar"
            >
                &times;
            </button>

        </div>


        <!--
        ==================================================
        FORMULÁRIO
        ==================================================
        -->

        <form id="formLinha">

            <!-- ID INTERNO - NÃO VISÍVEL -->

            <input
                type="hidden"
                id="id_linha"
            >


            <!--
            ==============================================
            CAMPOS
            ==============================================
            -->

            <div class="form-grid">


                <!-- EMPRESA -->

                <div class="campo campo-grande">

                    <label for="empresa">
                        Empresa *
                    </label>

                    <select
                        id="empresa"
                        required
                    >

                        <option value="">
                            Carregando empresas...
                        </option>

                    </select>

                </div>


                <!-- CÓDIGO -->

                <div class="campo">

                    <label for="cod">
                        Código *
                    </label>

                    <input
                        type="text"
                        id="cod"
                        required
                        autocomplete="off"
                    >

                </div>


                <!-- TIPO -->

                <div class="campo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo">
                        <option value="">Carregando tipos...</option>
                    </select>
                </div>


                <!-- LINHA -->

                <div class="campo campo-grande">

                    <label for="linha">
                        Linha *
                    </label>

                    <input
                        type="text"
                        id="linha"
                        required
                        autocomplete="off"
                    >

                </div>


                <!-- EMBARQUE IDA -->

                <div class="campo">

                    <label for="embarque_ida">
                        Embarque Ida
                    </label>

                    <input
                        type="text"
                        id="embarque_ida"
                        autocomplete="off"
                    >

                </div>


                <!-- EMBARQUE VOLTA -->

                <div class="campo">

                    <label for="embarque_volta">
                        Embarque Volta
                    </label>

                    <input
                        type="text"
                        id="embarque_volta"
                        autocomplete="off"
                    >

                </div>


                <!-- TARIFA CARTÃO -->

                <div class="campo">

                    <label for="tarifa_cartao">
                        Tarifa Cartão
                    </label>

                    <input
                        type="number"
                        id="tarifa_cartao"                        
                        placeholder="0,00"
                    >

                </div>


                <!-- TARIFA DINHEIRO -->

                <div class="campo">

                    <label for="tarifa_dinheiro">
                        Tarifa Dinheiro
                    </label>

                    <input
                        type="number"
                        id="tarifa_dinheiro"
                        placeholder="0,00"
                    >

                </div>


                <!-- STATUS -->

                <div class="campo">

                    <label for="status">
                        Status *
                    </label>

                    <select
                        id="status"
                        required
                    >

                        <option value="Ativa">
                            Ativa
                        </option>

                        <option value="Inativa">
                            Inativa
                        </option>

                    </select>

                </div>


            </div>


            <!--
            ==============================================
            BOTÕES
            ==============================================
            -->

            <div class="modal-botoes">

                <button
                    type="button"
                    id="btnCancelar"
                    class="btn-cancelar"
                >
                    CANCELAR
                </button>

                <button
                    type="submit"
                    id="btnSalvar"
                    class="btn-salvar"
                >
                    SALVAR
                </button>

            </div>

        </form>

    </div>

</div>
