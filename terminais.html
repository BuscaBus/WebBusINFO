
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Terminais</title>

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="./css/style.css?v=5"
    >

    <!-- CSS DO MODAL TERMINAL -->
    <link
        rel="stylesheet"
        href="./css/modal-terminal.css?v=2"
    >

    <link
        rel="stylesheet"
        href="./css/modal-consulta-box.css?v=1"
    >

</head>

<body>

    <!--
    ==========================================================
    CABEÇALHO
    ==========================================================
    -->

    <header>

        <h1>
            Cadastro de Terminais
        </h1>

    </header>


    <!--
    ==========================================================
    CONTEÚDO
    ==========================================================
    -->

    <main>

        <!--
        ======================================================
        BARRA DE AÇÕES
        ======================================================
        -->

        <div class="barra-acoes">

            <div class="acoes-esquerda">

                <!-- NOVO TERMINAL -->
                <button
                    type="button"
                    id="btnNovoTerminal"
                    class="btn-novo"
                >
                    NOVO TERMINAL
                </button>

                <!-- EMPRESAS -->
                <a
                    href="./empresas.html"
                    class="btn-tarifas"
                >
                    EMPRESAS
                </a>

                <!-- TARIFAS -->
                <a
                    href="./tarifas.html"
                    class="btn-tarifas"
                >
                    TARIFAS
                </a>

                <!-- LINHAS -->
                <a
                    href="./index.html"
                    class="btn-tarifas"
                >
                    LINHAS
                </a>

            </div>


            <!-- PESQUISA -->
            <input
                type="text"
                id="pesquisaTerminal"
                placeholder="Pesquisar terminais ou boxes..."
                autocomplete="off"
            >

        </div>


        <!--
        ======================================================
        TABELA DE TERMINAIS
        ======================================================
        -->

        <div class="tabela-container">

            <table id="tabelaTerminais">

                <thead>

                    <tr>

                        <th>
                            Terminal
                        </th>

                        <th>
                            Box
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="listaTerminais">

                    <tr>

                        <td colspan="3">
                            Carregando dados...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- PAGINAÇÃO DOS TERMINAIS -->
        <div class="paginacao" id="paginacaoTerminais">

            <button type="button" id="btnAnteriorTerminal">
                ANTERIOR
            </button>

            <span id="infoPaginaTerminal">
                Página 1 de 1
            </span>

            <button type="button" id="btnProximaTerminal">
                PRÓXIMA
            </button>

        </div>


        <!--
        ======================================================
        MENSAGENS
        ======================================================
        -->

        <div
            id="mensagem"
            class="mensagem"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <!--
    ==========================================================
    MODAL CADASTRO / EDIÇÃO
    ==========================================================
    -->

    <div id="containerModalTerminal"></div>


    <!--
    ==========================================================
    MODAL EXCLUSÃO
    ==========================================================
    -->

    <div id="containerModalExclusao"></div>


    <!-- MODAL CONSULTAR LINHAS DO BOX -->
    <div id="modalConsultaBox" class="modal-consulta-box">

        <div class="modal-consulta-conteudo">

            <div class="modal-consulta-cabecalho">
                <h2 id="tituloConsultaBox">
                    Linhas do Box
                </h2>

                <button
                    type="button"
                    id="btnFecharConsultaBox"
                    class="btn-fechar-consulta"
                >
                    &times;
                </button>
            </div>

            <div class="modal-consulta-corpo">

                <p id="descricaoConsultaBox"></p>

                <div class="tabela-container">
                    <table class="tabela-consulta-linhas">

                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Linha</th>
                                <th>Empresa</th>
                                <th>Sentido</th>
                            </tr>
                        </thead>

                        <tbody id="listaLinhasBox">
                            <tr>
                                <td colspan="4">
                                    Carregando linhas...
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>

                <p id="totalLinhasBox"></p>

            </div>

            <div class="modal-consulta-rodape">
                <button
                    type="button"
                    id="btnFecharConsultaRodape"
                >
                    FECHAR
                </button>
            </div>

        </div>

    </div>


    <!--
    ==========================================================
    JAVASCRIPT
    ==========================================================
    -->

    <script src="./js/terminais.js?v=5"></script>

</body>

</html>
