<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Tarifas</title>


    <!--
    ==========================================================
    CSS GERAL
    ==========================================================
    -->

    <link
        rel="stylesheet"
        href="./css/style.css?v=4"
    >


    <!--
    ==========================================================
    CSS MODAL TARIFA
    ==========================================================
    -->

    <link
        rel="stylesheet"
        href="./css/modal-tarifa.css?v=1"
    >

    <!--
    ==========================================================
    CSS MODAL EXCLUSÃO
    ==========================================================
    -->

    <link
        rel="stylesheet"
        href="./css/modal-exclusao.css?v=2"
    >

</head>


<body>

    <!--
    ==========================================================
    CABEÇALHO
    ==========================================================
    -->

    <header>

        <h1>
            Cadastro de Tarifas
        </h1>

    </header>


    <!--
    ==========================================================
    CONTEÚDO
    ==========================================================
    -->

    <main>


        <!--
        ======================================================
        BARRA DE AÇÕES
        ======================================================
        -->

        <div class="barra-acoes">


            <!--
            ==================================================
            BOTÕES ESQUERDA
            ==================================================
            -->

            <div class="acoes-esquerda">

                <a
                    href="./empresas.html"
                    class="btn-voltar"
                >
                    VOLTAR
                </a>


                <button
                    type="button"
                    id="btnNovaTarifa"
                    class="btn-novo"
                >
                    NOVA TARIFA
                </button>

            </div>


            <!--
            ==================================================
            PESQUISA
            ==================================================
            -->

            <input
                type="text"
                id="pesquisaTarifa"
                placeholder="Pesquisar tarifas..."
                autocomplete="off"
            >

        </div>


        <!--
        ======================================================
        TABELA
        ======================================================
        -->

        <div class="tabela-container">

            <table id="tabelaTarifas">

                <thead>

                    <tr>

                        <th>
                            Tipo
                        </th>

                        <th>
                            Cartão
                        </th>

                        <th>
                            Dinheiro
                        </th>

                        <th>
                            Atualização
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="listaTarifas">

                    <tr>

                        <td colspan="5">
                            Carregando dados...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <!--
        ======================================================
        MENSAGENS
        ======================================================
        -->

        <div
            id="mensagem"
            class="mensagem"
        ></div>


    </main>


    <!--
    ==========================================================
    MODAL CADASTRO / EDIÇÃO
    ==========================================================
    -->

    <div id="containerModalTarifa"></div>


    <!--
    ==========================================================
    MODAL EXCLUSÃO
    ==========================================================
    -->

    <div id="containerModalExclusao"></div>


    <!--
    ==========================================================
    JAVASCRIPT
    ==========================================================
    -->

    <script src="./js/tarifas.js?v=6"></script>


</body>

</html>
